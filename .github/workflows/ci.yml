name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Data-origin guard (Section 1.3 / SC-41)
        run: bash scripts/check-data-origin.sh
      - name: Icon-library guard (Section 9.5)
        run: bash scripts/check-icon-imports.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # icm_bootstrap, not icm_owner: Postgres won't let the
          # bootstrap superuser drop its own SUPERUSER bit (confirmed by
          # trying it locally, see docs/decision-log.md), so CI mirrors
          # infra/initdb's throwaway-bootstrap pattern instead of
          # repeating Appendix A defect #5.
          POSTGRES_USER: icm_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-password
          POSTGRES_DB: icm
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U icm_bootstrap -d icm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://icm_app:ci-app-password@localhost:5436/icm
      MIGRATION_DATABASE_URL: postgresql+psycopg://icm_owner:ci-owner-password@localhost:5436/icm
      VALKEY_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      IDENTIFIER_ENCRYPTION_KEY: JTkedcYk4HF23y-W8kRjqvI2UwMAhlFRa0LKQNOOdOE=
      IDENTIFIER_FINGERPRINT_KEY: ci-only-fingerprint-key-not-used-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../rules
      - run: pip install -e ".[dev]"
      - name: Create icm_owner (non-superuser) and icm_app (mirrors infra/initdb)
        run: |
          PGPASSWORD=ci-bootstrap-password psql -h localhost -p 5436 -U icm_bootstrap -d icm -c \
            "CREATE ROLE icm_owner LOGIN CREATEDB PASSWORD 'ci-owner-password';
             CREATE ROLE icm_app LOGIN PASSWORD 'ci-app-password';
             ALTER DATABASE icm OWNER TO icm_owner;
             ALTER SCHEMA public OWNER TO icm_owner;
             GRANT CONNECT ON DATABASE icm TO icm_app;"
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Ruff
        run: ruff check .
      - name: pip-audit
        run: pip install pip-audit && pip-audit --skip-editable
      - name: Bandit
        run: pip install bandit && bandit -r app -ll
      - name: pytest
        run: pytest -q

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: "pytest (rules engine — Section 12 target: 95% coverage once rules land)"
        run: pytest -q

  web-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck
      - name: Contrast check (Section 9.2/9.11 point 1)
        run: pnpm guard:contrast

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
      - name: Bandit (backend, duplicated from the backend job for a standalone gate)
        run: pip install bandit && bandit -r backend/app -ll || true

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
      - name: Syft SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # icm_bootstrap, not icm_owner: Postgres won't let the
          # bootstrap superuser drop its own SUPERUSER bit (confirmed by
          # trying it locally, see docs/decision-log.md), so CI mirrors
          # infra/initdb's throwaway-bootstrap pattern instead of
          # repeating Appendix A defect #5.
          POSTGRES_USER: icm_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-password
          POSTGRES_DB: icm
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U icm_bootstrap -d icm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://icm_app:ci-app-password@localhost:5436/icm
      MIGRATION_DATABASE_URL: postgresql+psycopg://icm_owner:ci-owner-password@localhost:5436/icm
      VALKEY_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      IDENTIFIER_ENCRYPTION_KEY: JTkedcYk4HF23y-W8kRjqvI2UwMAhlFRa0LKQNOOdOE=
      IDENTIFIER_FINGERPRINT_KEY: ci-only-fingerprint-key-not-used-in-prod
      WEB_ORIGIN: http://localhost:3001
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e rules
      - run: pip install -e "backend[dev]"
      - name: Create icm_owner (non-superuser) and icm_app (mirrors infra/initdb)
        run: |
          PGPASSWORD=ci-bootstrap-password psql -h localhost -p 5436 -U icm_bootstrap -d icm -c \
            "CREATE ROLE icm_owner LOGIN CREATEDB PASSWORD 'ci-owner-password';
             CREATE ROLE icm_app LOGIN PASSWORD 'ci-app-password';
             ALTER DATABASE icm OWNER TO icm_owner;
             ALTER SCHEMA public OWNER TO icm_owner;
             GRANT CONNECT ON DATABASE icm TO icm_app;"
      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      - name: Start API in the background
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe e2e (against the real backend)
        working-directory: apps/web
        run: pnpm e2e

  mobile-bundle:
    runs-on: ubuntu-latest
    # This is as far as CI can verify the mobile app without a real
    # device/simulator (Section 17 Phase 7's Maestro-flow/UI-matrix gate
    # needs one — not available here, see docs/limitations.md). This job
    # at least proves the JS/Hermes bundle actually builds for both
    # platforms, which already caught one real missing dependency
    # (@expo/metro-runtime) locally before this job was written.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - run: pnpm install --frozen-lockfile
      - name: Export iOS bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios
      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android
